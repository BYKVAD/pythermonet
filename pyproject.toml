[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythermonet"
version = "0.1.0"
description = "pythermonetII"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.4,<3",
  "scipy>=1.11,<2",
  "pandas>=3.0,<4",
  "mpmath>=1.3,<2",
  "pygfunction>=2.2,<3",
]

[project.optional-dependencies]
dev = ["matplotlib>=3.9,<4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
