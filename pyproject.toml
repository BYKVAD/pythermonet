[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythermonet"
version = "0.2.0"
description = "pythermonet"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.4,<3",
  "scipy>=1.11,<2",
  "pandas>=3.0,<4",
  "mpmath>=1.3,<2",
  "pygfunction>=2.2,<3",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
]

[project.optional-dependencies]
dev = ["matplotlib>=3.9,<4", "pytest>=8.0,<9", "pip-tools>=7.0,<8", "ruff>=0.4", "mypy>=1.10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pythermonet = ["resources/*.csv"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # E/W: pycodestyle, F: pyflakes, I: isort

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
